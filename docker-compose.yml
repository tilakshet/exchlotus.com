services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: exchlotus_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env before starting}
      POSTGRES_DB: exchlotus_dev
    ports:
      - "5433:5432"
    volumes:
      - exchlotus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchlotus_app -d exchlotus_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - exchlotus_redisdata:/data

volumes:
  exchlotus_pgdata:
  exchlotus_redisdata:
